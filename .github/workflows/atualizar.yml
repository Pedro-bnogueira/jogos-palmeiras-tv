# Atualiza jogos.json três vezes por dia (06h17, 12h17 e 18h17 de Brasília) e quando pedido à mão
# (Actions → Atualizar jogos → Run workflow). Sem ações de terceiros: só git e o Python do próprio runner.
name: Atualizar jogos

on:
  schedule:
    - cron: "17 9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jogos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Baixar o repositório
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Gerar jogos.json
        working-directory: repo
        run: python3 -I gerar_jogos.py jogos.json

      - name: Publicar
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jogos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Atualiza jogos"
          git push -q
